name: Release

# Pushing a version tag (1.2.3, the version in package.json) builds every installer, signs what the
# configured credentials allow, and publishes the GitHub release with SHA256SUMS.txt. Run it by hand
# with a tag to rebuild an existing release's assets.
#
# Signing switches on by itself once its settings exist (Settings > Secrets and variables > Actions):
# - macOS Developer ID + notarization (jswallet-kvl):
#     secrets  APPLE_DEVELOPER_ID_P12_BASE64, APPLE_DEVELOPER_ID_P12_PASSWORD, APPLE_API_KEY_P8
#     variables APPLE_SIGNING_IDENTITY ("Developer ID Application: Name (TEAMID)"),
#               APPLE_API_KEY_ID, APPLE_API_ISSUER
#   Without them the app is signed ad hoc (forge.config.mjs), and Gatekeeper asks to "Open Anyway".
# - Windows Authenticode through SignPath (jswallet-yku):
#     secret   SIGNPATH_API_TOKEN
#     variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG
#   SignPath signs the Squirrel Setup.exe, uploaded as a zip with that one file in it; the project's
#   artifact configuration on signpath.io has to describe that. Without them it stays unsigned.
#
# Release notes come from docs/releases/<tag>.md. Without that file the release is created as a
# draft with GitHub's generated notes, to be reviewed and published by hand.

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (its release is updated)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: The tag is the version in package.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
      - run: npm ci --strict-allow-scripts
      - run: npm run check
      - run: npm run audit

  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      # Install scripts run here, before any credential is in the job.
      - run: npm ci --strict-allow-scripts

      - name: Is a Developer ID configured?
        id: apple
        if: runner.os == 'macOS'
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$P12_BASE64" ] && [ -n "$IDENTITY" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"; fi
      - name: Import the Developer ID certificate and the notarization key
        if: steps.apple.outputs.configured == 'true'
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          if [ -n "$API_KEY_P8" ]; then
            printf '%s' "$API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      # forge.config.mjs signs with the Developer ID when APPLE_SIGNING_IDENTITY is set, and notarizes
      # when the API key is there too; otherwise the macOS app is signed ad hoc.
      - run: npm run make
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.apple.outputs.configured == 'true' && vars.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
      - if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 out/jswallet-darwin-*/jswallet.app
      # Gatekeeper accepts a Developer ID app only once it is notarized.
      - if: steps.apple.outputs.configured == 'true' && env.APPLE_API_KEY != '' && vars.APPLE_API_KEY_ID != ''
        run: spctl --assess --type execute --verbose=4 out/jswallet-darwin-*/jswallet.app
      - if: always() && steps.apple.outputs.configured == 'true'
        run: rm -f "$RUNNER_TEMP/AuthKey.p8" && security delete-keychain "$RUNNER_TEMP/signing.keychain-db"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: make-${{ runner.os }}-${{ runner.arch }}
          path: out/make
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  sign-windows:
    needs: build
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # SignPath downloads the unsigned artifact through the GitHub API
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: make-Windows-X64
          path: windows
      - id: unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-setup-unsigned
          path: windows/squirrel.windows/x64/*Setup.exe
          if-no-files-found: error
          retention-days: 1
      - uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          connector-url: https://githubactions.connectors.signpath.io
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-setup-signed
          path: signed
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [check, build, sign-windows]
    # sign-windows is skipped while SignPath isn't configured.
    if: >-
      always() && needs.check.result == 'success' && needs.build.result == 'success'
      && (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: make-*
          path: artifacts
      - if: needs.sign-windows.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-setup-signed
          path: artifacts/windows-signed
      - name: Collect the installers
        run: |
          set -euo pipefail
          mkdir dist
          shopt -s nullglob
          setup=(artifacts/windows-signed/*Setup.exe)
          [ ${#setup[@]} -eq 0 ] && setup=(artifacts/make-Windows-X64/squirrel.windows/x64/*Setup.exe)
          cp "${setup[0]}" "dist/jswallet-$TAG-Setup-x64.exe"
          cp artifacts/make-macOS-ARM64/zip/darwin/arm64/*.zip dist/
          cp artifacts/make-macOS-X64/zip/darwin/x64/*.zip dist/
          cp artifacts/make-Linux-X64/deb/x64/*.deb artifacts/make-Linux-X64/rpm/x64/*.rpm dist/
          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          [ "$(ls dist | wc -l)" -eq 6 ] || { echo "::error::Expected 5 installers and SHA256SUMS.txt"; ls dist; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="docs/releases/$TAG.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            [ -f "$notes" ] && gh release edit "$TAG" --notes-file "$notes"
          elif [ -f "$notes" ]; then
            gh release create "$TAG" dist/* --verify-tag --title "JSWallet $TAG" --notes-file "$notes"
          else
            gh release create "$TAG" dist/* --verify-tag --title "JSWallet $TAG" --generate-notes --draft
          fi
